apiVersion: v1
kind: Service
metadata:
  name: kanban-backend-service
  namespace: kanban-thunder
  labels:
    app.kubernetes.io/name: kanban-thunder
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: kanban-thunder
    app.kubernetes.io/component: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanban-backend
  namespace: kanban-thunder
  labels:
    app.kubernetes.io/name: kanban-thunder
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: kanban-thunder
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kanban-thunder
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres database at kanban-db-service:5432..."
              until pg_isready -h kanban-db-service -p 5432 -U postgres; do
                echo "Postgres is unavailable - sleeping 2s"
                sleep 2
              done
              echo "Database is ready!"
      containers:
        - name: backend
          image: kanban-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: kanban-config
            - secretRef:
                name: kanban-secrets
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
