apiVersion: v1
kind: ConfigMap
metadata:
  name: kanban-config
  namespace: kanban-thunder
  labels:
    app.kubernetes.io/name: kanban-thunder
data:
  # Django Backend Configuration
  DEBUG: "False"
  ALLOWED_HOSTS: "*"
  DB_HOST: "kanban-db-service"
  DB_PORT: "5432"
  DB_NAME: "thunder_db"
  CORS_ALLOWED_ORIGINS: "http://localhost,http://127.0.0.1,http://kanban.local"
  GOOGLE_CLIENT_ID: ""
  SESSION_COOKIE_SECURE: "False"
  CSRF_COOKIE_SECURE: "False"
  SECURE_SSL_REDIRECT: "False"

  # Frontend Configuration
  VITE_API_BASE_URL: "/api/v1"
