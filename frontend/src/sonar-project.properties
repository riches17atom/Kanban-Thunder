sonar.projectKey=Kanban-Thunder

# Main source directory
sonar.sources=src
# Exclude test files from main source indexing
sonar.exclusions=src/**/*.test.js

# Treat src as the folder where test files live
sonar.tests=src
# Include only test files under sonar.tests
sonar.test.inclusions=src/**/*.test.js

# Coverage report path (camelCase)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
