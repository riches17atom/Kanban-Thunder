sonar.projectKey=Kanban-Thunder
sonar.projectName=Kanban Thunder

# Sources
sonar.sources=frontend/src,backend

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,backend/venv/**,**/__pycache__/**,backend/staticfiles/**,backend/**/migrations/**

# Tests & Inclusions
sonar.tests=frontend/src,backend
sonar.test.inclusions=frontend/src/**/*.test.{js,ts,tsx},backend/**/test_*.py,backend/**/tests/**

# Code Coverage Reports (if generated during CI test run)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=backend/coverage.xml

sonar.sourceEncoding=UTF-8

