name: CI/CD Pipeline - Test, Build and Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    name: Build & Validate Containers and IaC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies & Validate Django
        run: |
          cd backend
          pip install -r requirements.txt
          python -m compileall .

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build React Frontend Bundle
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Validate Kubernetes Manifests
        run: |
          kubectl kustomize k8s/ > /dev/null

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Validate Terraform Code
        run: |
          cd terraform
          terraform init -backend=false
          terraform fmt -check
          terraform validate

  deploy:
    name: Deploy to AWS EC2
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deployment via SSH (if secrets configured)
        if: env.SSH_HOST != '' && env.SSH_KEY != ''
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "Connecting to $SSH_HOST and executing deployment..."
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@$SSH_HOST "cd /home/ubuntu/app && git pull origin main && docker compose up -d --build"
